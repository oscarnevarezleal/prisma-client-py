[mypy]
pretty = True
python_version = 3.8
show_error_codes = True
plugins = pydantic.mypy
exclude = tests/integrations|prisma/_vendor|prisma/_raw_query

strict_equality = True
implicit_reexport = True
check_untyped_defs = True
no_implicit_optional = True

warn_return_any = True
warn_unreachable = True
warn_unused_configs = True
warn_unused_ignores = True
warn_redundant_casts = True

disallow_any_generics = True
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_subclassing_any = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
cache_fine_grained = True

# `httpx` pulls in `anyio`, whose source now uses `match` statements (3.10+).
# We type-check against `python_version = 3.8`, so mypy following imports into
# anyio's source fails to parse it before any of our own code is checked. We
# don't use anyio directly, so skip following imports into it.
[mypy-anyio.*]
follow_imports = skip
